name: Launch test (emulator)

# Builds the app, installs it on an Android emulator, launches it and saves logcat.
# Walks the main screens with a smoke test (.github/scripts/smoke.py) and fails on any crash.
# Runs on pushes to main, feature/** and diag/** branches, on pull requests, and by hand.

on:
  push:
    branches: [ main, 'diag/**', 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Throwaway signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/test.jks" -storepass testpass -keypass testpass \
            -alias test -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Nobody Listens Test"
          {
            echo "storeFile=$RUNNER_TEMP/test.jks"
            echo "storePassword=testpass"
            echo "keyAlias=test"
            echo "keyPassword=testpass"
          } > keystore.properties

      - name: Build release APK (universal, includes x86_64 for the emulator)
        run: ./gradlew :app:assembleRelease --stacktrace -Plmusic.smokeTest=true -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: Free disk space for the emulator
        run: |
          mkdir -p apk && cp app/build/outputs/apk/release/*.apk apk/
          ./gradlew --stop || true
          rm -rf app/build ~/.gradle/caches
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install ffmpeg (test songs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 3000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/launch-test.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-logs
          path: launch-logs/
