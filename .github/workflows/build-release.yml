name: Build & Release Nobody Listens

# Every push to main builds signed phone and watch APKs (download them from the run's "Artifacts").
# Releases: when a push to main carries a version (APP_VERSION_NAME in gradle.properties)
# that has no GitHub Release yet, the build is published as release v<version> with every
# APK attached (arm64-v8a, armeabi-v7a, x86_64, universal and the watch). So to ship 1.1.0:
# bump APP_VERSION_NAME, add release-notes/v1.1.0.md, push.
# Pushing a tag like v1.2.0 publishes that version too.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CI signing key is generated once and kept in the Actions cache under this name.
  SIGNING_CACHE_KEY: lmusic-signing-key-v1
  SIGNING_DIR: .lmusic-signing

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---- Signing -------------------------------------------------------------
      # Preferred: your own key in repository secrets (LMUSIC_KEYSTORE_B64,
      # LMUSIC_KEYSTORE_PASSWORD, LMUSIC_KEY_ALIAS). Without them, a key generated
      # by CI on the first main-branch build is reused from the Actions cache, so
      # every APK is signed the same way and installs as an update.
      - name: Use signing key from secrets
        id: secret-key
        env:
          KEYSTORE_B64: ${{ secrets.LMUSIC_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LMUSIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LMUSIC_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$SIGNING_DIR"
          echo "$KEYSTORE_B64" | base64 -d > "$SIGNING_DIR/lmusic.jks"
          {
            echo "storeFile=$GITHUB_WORKSPACE/$SIGNING_DIR/lmusic.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Restore CI signing key
        if: steps.secret-key.outputs.found != 'true'
        id: restore-key
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SIGNING_DIR }}
          key: ${{ env.SIGNING_CACHE_KEY }}

      - name: Generate CI signing key (first run only)
        if: steps.secret-key.outputs.found != 'true' && steps.restore-key.outputs.cache-hit != 'true'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::No signing key yet. Push to main once so CI can create it, then re-run this build."
            exit 1
          fi
          mkdir -p "$SIGNING_DIR"
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$SIGNING_DIR/lmusic.jks" -alias lmusic \
            -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Nobody Listens, O=Nobody Builds"
          echo "$PASS" > "$SIGNING_DIR/password"

      - name: Save CI signing key
        if: steps.secret-key.outputs.found != 'true' && steps.restore-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SIGNING_DIR }}
          key: ${{ env.SIGNING_CACHE_KEY }}

      - name: Write signing config from CI key
        if: steps.secret-key.outputs.found != 'true'
        run: |
          PASS="$(cat "$SIGNING_DIR/password")"
          {
            echo "storeFile=$GITHUB_WORKSPACE/$SIGNING_DIR/lmusic.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=lmusic"
            echo "keyPassword=$PASS"
          } > keystore.properties

      # ---- Version -------------------------------------------------------------
      - name: Work out version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(( GITHUB_RUN_NUMBER + 100 ))
          BASE="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          RELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
            RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] && \
               ! gh release view "v$BASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            NAME="$BASE"
            RELEASE=true
          else
            NAME="$BASE-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Building Nobody Listens $NAME ($CODE), release=$RELEASE"

      # ---- Build ---------------------------------------------------------------
      - name: Build release APKs
        run: |
          chmod +x gradlew
          # Phone APKs are split per ABI. Releases also build x86_64 and a universal APK
          # (every ABI in one, largest); other builds keep to arm64-v8a and armeabi-v7a.
          # The Wear OS watch app (Galaxy Watch 4 and newer) is signed with the same key so it pairs.
          ./gradlew :app:assembleRelease :wear:assembleRelease --stacktrace \
            -Plmusic.enableAbiSplits=true \
            -Plmusic.allApks=${{ steps.version.outputs.release }} \
            -PAPP_VERSION_CODE=${{ steps.version.outputs.code }} \
            -PAPP_VERSION_NAME=${{ steps.version.outputs.name }}

      - name: Verify and rename APKs
        run: |
          ls -la app/build/outputs/apk/release/ wear/build/outputs/apk/release/
          V="${{ steps.version.outputs.name }}"
          mkdir dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            ABI="$(basename "$f" -release.apk)"
            cp "$f" "dist/NobodyListens-$V-${ABI#app-}.apk"
          done
          cp wear/build/outputs/apk/release/wear-release.apk "dist/NobodyListens-Watch-$V.apk"
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for f in dist/*.apk; do
            "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$f" | head -n 3
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$f" | head -n 4
          done
          ls -la dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NobodyListens-${{ steps.version.outputs.name }}
          path: dist/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          NOTES_FILE="release-notes/${TAG}.md"
          ARGS=(--title "Nobody Listens ${TAG}" --target "$GITHUB_SHA")
          if [ -f "$NOTES_FILE" ]; then ARGS+=(--notes-file "$NOTES_FILE"); else ARGS+=(--generate-notes); fi
          gh release create "$TAG" dist/*.apk "${ARGS[@]}"
